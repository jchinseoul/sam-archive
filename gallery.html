<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAM ARCHIVE</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      main.gallery {
        flex: 1;
        overflow: auto;
        padding: 1rem;
      }
      .gallery-layout {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        align-items: flex-start;
      }
      .gallery-strip {
        flex: 2 1 320px;
        display: flex;
        gap: 0.75rem;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding-bottom: 0.5rem;
      }
      .gallery-strip img {
        flex: 0 0 auto;
        height: 58vh;
        width: auto;
        max-width: 70vw;
        border-radius: 10px;
        scroll-snap-align: center;
        object-fit: contain;
      }
      .side-panel {
        flex: 1 1 240px;
        min-width: 240px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .caption {
        white-space: pre-wrap;
        line-height: 1.6;
        font-size: 0.95rem;
      }
      .like-btn {
        align-self: flex-start;
        padding: 0.5rem 1rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        font-size: 0.9rem;
        cursor: pointer;
      }
      .like-btn.liked {
        border-color: #e0483e;
        color: #e0483e;
      }
      .like-hint {
        font-size: 0.75rem;
        opacity: 0.55;
      }
      a.back {
        color: var(--fg);
        text-decoration: none;
        opacity: 0.7;
        font-size: 0.85rem;
      }
      a.back:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="index.html" style="color: inherit; text-decoration: none">SAM ARCHIVE</a></h1>
      <a class="back" href="index.html">← 마인드맵으로</a>
    </header>
    <main class="gallery">
      <div class="gallery-layout">
        <div class="gallery-strip" id="stripEl"></div>
        <div class="side-panel">
          <p class="caption" id="captionEl" hidden></p>
          <div>
            <button class="like-btn" id="likeBtn" type="button">🤍 좋아요</button>
            <p class="like-hint">이 브라우저에만 기억되는 좋아요입니다.</p>
          </div>
        </div>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const imgs = (params.get("imgs") || "")
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);
      const textPath = params.get("text");

      const strip = document.getElementById("stripEl");
      if (imgs.length) {
        imgs.forEach((src) => {
          const img = document.createElement("img");
          img.src = src;
          img.alt = "";
          strip.appendChild(img);
        });
      } else {
        strip.textContent = "표시할 이미지가 없습니다.";
      }

      const captionEl = document.getElementById("captionEl");
      if (textPath) {
        fetch(textPath)
          .then((res) => (res.ok ? res.text() : Promise.reject()))
          .then((text) => {
            captionEl.textContent = text;
            captionEl.hidden = false;
          })
          .catch(() => {});
      }

      // 좋아요는 서버가 없는 정적 사이트라 방문자 전체 집계는 불가능하고,
      // 이 브라우저에서 눌렀는지만 localStorage에 기억한다.
      const likeKey = `sam_archive_like:${location.search}`;
      const likeBtn = document.getElementById("likeBtn");
      function renderLike() {
        const liked = localStorage.getItem(likeKey) === "1";
        likeBtn.textContent = liked ? "❤️ 좋아요 취소" : "🤍 좋아요";
        likeBtn.classList.toggle("liked", liked);
      }
      likeBtn.addEventListener("click", () => {
        const liked = localStorage.getItem(likeKey) === "1";
        if (liked) localStorage.removeItem(likeKey);
        else localStorage.setItem(likeKey, "1");
        renderLike();
      });
      renderLike();
    </script>
  </body>
</html>
