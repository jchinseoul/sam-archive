<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAM ARCHIVE — 이미지 보기</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      main.gallery {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 1rem;
      }
      p.gallery-hint {
        font-size: .85rem;
        opacity: .65;
        margin: 0 0 .75rem;
      }
      .gallery-strip {
        flex: 1;
        display: flex;
        gap: .75rem;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        padding-bottom: .5rem;
      }
      .gallery-strip img {
        flex: 0 0 auto;
        max-height: 100%;
        max-width: 90vw;
        border-radius: 10px;
        scroll-snap-align: center;
        object-fit: contain;
      }
      a.back {
        color: var(--fg);
        text-decoration: none;
        opacity: .7;
        font-size: .85rem;
      }
      a.back:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <header>
      <h1>🖼 이미지 보기</h1>
      <a class="back" href="index.html">← 마인드맵으로</a>
    </header>
    <main class="gallery">
      <p class="gallery-hint">옆으로 스크롤하면 다음 이미지를 볼 수 있습니다.</p>
      <div class="gallery-strip" id="stripEl"></div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const imgs = (params.get('imgs') || '').split(',').map((s) => s.trim()).filter(Boolean);
      const strip = document.getElementById('stripEl');
      if (imgs.length) {
        imgs.forEach((src) => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = '';
          strip.appendChild(img);
        });
      } else {
        strip.textContent = '표시할 이미지가 없습니다.';
      }
    </script>
  </body>
</html>
