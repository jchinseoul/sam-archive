<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAM ARCHIVE</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      main.gallery {
        flex: 1;
        overflow: auto;
        padding: 1rem;
      }
      .gallery-layout {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        align-items: flex-start;
      }
      .gallery-layout.text-only .gallery-strip {
        display: none;
      }
      .gallery-layout.text-only .side-panel {
        flex: 1 1 auto;
        max-width: 560px;
      }
      .gallery-strip {
        flex: 2 1 320px;
        display: flex;
        gap: 0.75rem;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding-bottom: 0.5rem;
      }
      .gallery-strip img,
      .gallery-strip video {
        flex: 0 0 auto;
        height: 58vh;
        width: auto;
        max-width: 70vw;
        border-radius: 10px;
        scroll-snap-align: center;
        object-fit: contain;
      }
      .gallery-strip iframe {
        flex: 0 0 auto;
        width: min(70vw, 640px);
        height: min(58vh, 360px);
        border: 0;
        border-radius: 10px;
      }
      .video-link {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--fg);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .video-link:hover {
        opacity: 0.8;
      }
      .side-panel {
        flex: 1 1 240px;
        min-width: 240px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .caption {
        white-space: pre-wrap;
        line-height: 1.6;
        font-size: 0.95rem;
      }
      .like-btn {
        align-self: flex-start;
        padding: 0.5rem 1rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        font-size: 0.9rem;
        cursor: pointer;
      }
      .like-btn.liked {
        border-color: #e0483e;
        color: #e0483e;
      }
      .like-hint {
        font-size: 0.75rem;
        opacity: 0.55;
      }
      a.back {
        color: var(--fg);
        text-decoration: none;
        opacity: 0.7;
        font-size: 0.85rem;
      }
      a.back:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="index.html" style="color: inherit; text-decoration: none">SAM ARCHIVE</a></h1>
      <a class="back" href="index.html">← 마인드맵으로</a>
    </header>
    <main class="gallery">
      <div class="gallery-layout" id="layoutEl">
        <div class="gallery-strip" id="stripEl"></div>
        <div class="side-panel">
          <p class="caption" id="captionEl" hidden></p>
          <div>
            <button class="like-btn" id="likeBtn" type="button">🤍 좋아요</button>
            <p class="like-hint">이 브라우저에만 기억되는 좋아요입니다.</p>
          </div>
        </div>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const imgs = (params.get("imgs") || "")
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);
      const video = params.get("video");
      const textPath = params.get("text");

      const strip = document.getElementById("stripEl");
      const layoutEl = document.getElementById("layoutEl");

      function isExternalUrl(s) {
        return /^https?:\/\//.test(s);
      }

      if (imgs.length) {
        imgs.forEach((src) => {
          const img = document.createElement("img");
          img.src = src;
          img.alt = "";
          strip.appendChild(img);
        });
      } else if (video) {
        if (isExternalUrl(video)) {
          const ytMatch = video.match(
            /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/,
          );
          if (ytMatch) {
            const iframe = document.createElement("iframe");
            iframe.src = `https://www.youtube.com/embed/${ytMatch[1]}`;
            iframe.allow =
              "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
            iframe.allowFullscreen = true;
            strip.appendChild(iframe);
          } else {
            const a = document.createElement("a");
            a.href = video;
            a.target = "_blank";
            a.rel = "noopener";
            a.className = "video-link";
            a.textContent = "원본 영상 보기 →";
            strip.appendChild(a);
          }
        } else {
          const v = document.createElement("video");
          v.src = video;
          v.controls = true;
          strip.appendChild(v);
        }
      } else {
        layoutEl.classList.add("text-only");
      }

      const captionEl = document.getElementById("captionEl");
      if (textPath) {
        fetch(`${textPath}?t=${Date.now()}`, { cache: "no-store" })
          .then((res) => (res.ok ? res.text() : Promise.reject()))
          .then((text) => {
            captionEl.textContent = text;
            captionEl.hidden = false;
          })
          .catch(() => {});
      }

      // 좋아요는 서버가 없는 정적 사이트라 방문자 전체 집계는 불가능하고,
      // 이 브라우저에서 눌렀는지만 localStorage에 기억한다.
      const likeKey = `sam_archive_like:${location.search}`;
      const likeBtn = document.getElementById("likeBtn");
      function renderLike() {
        const liked = localStorage.getItem(likeKey) === "1";
        likeBtn.textContent = liked ? "❤️ 좋아요 취소" : "🤍 좋아요";
        likeBtn.classList.toggle("liked", liked);
      }
      likeBtn.addEventListener("click", () => {
        const liked = localStorage.getItem(likeKey) === "1";
        if (liked) localStorage.removeItem(likeKey);
        else localStorage.setItem(likeKey, "1");
        renderLike();
      });
      renderLike();
    </script>
  </body>
</html>
